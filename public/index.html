<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terabox Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 15px; font-size: 1rem; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #4CAF50; color: #fff; font-size: 1rem; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; word-break: break-all; }
        .file { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .file a { color: #4CAF50; text-decoration: none; }
        .error { color: #ff5555; }
        .loading { color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Terabox Downloader</h1>
        <input type="text" id="url" placeholder="Paste Terabox link here...">
        <button onclick="fetchFiles()">Get Download Link</button>
        <div id="result"></div>
    </div>
    <script>
        async function fetchFiles() {
            const url = document.getElementById('url').value.trim();
            const result = document.getElementById('result');
            if (!url) { result.innerHTML = '<p class="error">Enter a URL</p>'; return; }
            result.innerHTML = '<p class="loading">Loading...</p>';
            try {
                const res = await fetch('/api/download?url=' + encodeURIComponent(url));
                const data = await res.json();
                if (data.success && data.files) {
                    result.innerHTML = data.files.map(f => `
                        <div class="file">
                            <p><strong>${f.filename}</strong></p>
                            <p>${(f.size / 1024 / 1024).toFixed(2)} MB</p>
                            ${f.dlink ? `<a href="${f.dlink}" target="_blank">⬇ Download</a>` : '<p class="error">No link</p>'}
                        </div>
                    `).join('');
                } else {
                    result.innerHTML = `<p class="error">${data.error || 'Failed'}</p>`;
                }
            } catch (e) {
                result.innerHTML = `<p class="error">${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
